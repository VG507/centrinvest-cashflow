components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        app:
          type: string
      required:
        - status
        - app
      additionalProperties: false
    ForecastRequest:
      type: object
      properties:
        initial_balance:
          $ref: "#/components/schemas/Money"
          description: Closing balance on the last history day.
        horizon_days:
          type: number
          description: Client uses 30, 60 or 90; legacy backend defaults to 14.
        history:
          type: array
          items:
            $ref: "#/components/schemas/TransactionPoint"
      required:
        - initial_balance
        - horizon_days
        - history
      additionalProperties: false
    Money:
      type: number
    TransactionPoint:
      type: object
      properties:
        date:
          $ref: "#/components/schemas/LocalDate"
        income:
          type: number
        expense:
          type: number
      required:
        - date
        - income
        - expense
      additionalProperties: false
    LocalDate:
      type: string
      format: date
    ForecastResult:
      type: object
      properties:
        predicted_dates:
          type: array
          items:
            $ref: "#/components/schemas/LocalDate"
        predicted_income:
          type: array
          items:
            $ref: "#/components/schemas/Money"
        predicted_expense:
          type: array
          items:
            $ref: "#/components/schemas/Money"
        predicted_balance:
          type: array
          items:
            $ref: "#/components/schemas/Money"
        cashflow_gap_detected:
          type: boolean
        gap_dates:
          type: array
          items:
            $ref: "#/components/schemas/LocalDate"
        minimum_expected_balance:
          $ref: "#/components/schemas/Money"
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
      required:
        - predicted_dates
        - predicted_income
        - predicted_expense
        - predicted_balance
        - cashflow_gap_detected
        - gap_dates
        - minimum_expected_balance
        - risk_level
      additionalProperties: false
    RiskLevel:
      type: string
      enum:
        - low
        - medium
        - critical
    AdvisorRequest:
      type: object
      properties:
        forecast:
          $ref: "#/components/schemas/ForecastResult"
        business_type:
          type: string
      required:
        - forecast
        - business_type
      additionalProperties: false
    AdvisorResponse:
      type: object
      properties:
        analysis:
          type: string
        recommendations:
          type: array
          items:
            type: string
        urgent_action_required:
          type: boolean
      required:
        - analysis
        - recommendations
        - urgent_action_required
      additionalProperties: false
    CapabilitiesResponse:
      type: object
      properties:
        contract_version:
          type: string
        features:
          type: array
          items:
            type: string
            enum:
              - imports
              - categorization
              - recurring
              - forecast_v2
              - probability
              - events
              - scenarios
              - plan_actual
              - evaluation
              - integrations
              - advice
      required:
        - contract_version
        - features
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
      additionalProperties: false
    SessionResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              $ref: "#/components/schemas/EntityId"
            display_name:
              type: string
            company_ids:
              type: array
              items:
                $ref: "#/components/schemas/EntityId"
          required:
            - id
            - display_name
            - company_ids
          additionalProperties: false
        expires_at:
          $ref: "#/components/schemas/UtcTimestamp"
      required:
        - user
        - expires_at
      additionalProperties: false
    EntityId:
      type: string
    UtcTimestamp:
      type: string
      format: date-time
    LogoutResponse:
      type: object
      properties:
        signed_out:
          type: boolean
      required:
        - signed_out
      additionalProperties: false
    CompanyListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Company"
      required:
        - items
      additionalProperties: false
    Company:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/EntityId"
        name:
          type: string
        business_type:
          type: string
        currency:
          $ref: "#/components/schemas/Currency"
        timezone:
          type: string
        closing_balance:
          anyOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: Last observed closing balance, not an estimated live bank balance.
        balance_date:
          anyOf:
            - $ref: "#/components/schemas/LocalDate"
            - type: "null"
        data_revision:
          type: number
      required:
        - id
        - name
        - business_type
        - currency
        - timezone
        - closing_balance
        - balance_date
        - data_revision
      additionalProperties: false
    Currency:
      type: string
      const: RUB
    CompanyCreateRequest:
      type: object
      properties:
        name:
          type: string
        business_type:
          type: string
        timezone:
          type: string
      required:
        - name
        - business_type
        - timezone
      additionalProperties: false
    CategoryListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"
      required:
        - items
      additionalProperties: false
    Category:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/CategoryId"
        name:
          type: string
        direction:
          anyOf:
            - $ref: "#/components/schemas/Direction"
            - type: string
              const: both
      required:
        - id
        - name
        - direction
      additionalProperties: false
    CategoryId:
      type: string
      enum:
        - sales
        - other_income
        - payroll
        - rent
        - suppliers
        - taxes
        - loan
        - fees
        - equipment
        - transfer
        - other_expense
        - uncategorized
    Direction:
      type: string
      enum:
        - income
        - expense
    StatementImportForm:
      type: object
      properties:
        file:
          type: string
          format: binary
        format:
          type: string
          enum:
            - csv
            - xlsx
            - 1c
        column_mapping:
          type: string
        balance_policy:
          type: string
          enum:
            - reject_conflicts
            - use_last_row
      required:
        - file
        - format
        - column_mapping
        - balance_policy
      additionalProperties: false
      description: Multipart field description; file is binary, column_mapping is JSON-serialized ColumnMapping.
    ImportResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/EntityId"
        company_id:
          $ref: "#/components/schemas/EntityId"
        status:
          type: string
          enum:
            - ready
            - rejected
        accepted_rows:
          type: number
        duplicate_rows:
          type: number
        rejected_rows:
          type: number
        period_start:
          anyOf:
            - $ref: "#/components/schemas/LocalDate"
            - type: "null"
        period_end:
          anyOf:
            - $ref: "#/components/schemas/LocalDate"
            - type: "null"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ImportIssue"
        data_revision:
          type: number
      required:
        - id
        - company_id
        - status
        - accepted_rows
        - duplicate_rows
        - rejected_rows
        - period_start
        - period_end
        - issues
        - data_revision
      additionalProperties: false
    ImportIssue:
      type: object
      properties:
        row:
          type:
            - number
            - "null"
        field:
          type:
            - string
            - "null"
        code:
          type: string
        message:
          type: string
      required:
        - row
        - field
        - code
        - message
      additionalProperties: false
    TransactionQuery:
      type: object
      properties:
        from_date:
          $ref: "#/components/schemas/LocalDate"
        to_date:
          $ref: "#/components/schemas/LocalDate"
        limit:
          type: number
        cursor:
          type: string
        direction:
          $ref: "#/components/schemas/Direction"
        category_id:
          $ref: "#/components/schemas/CategoryId"
        search:
          type: string
      additionalProperties: false
    TransactionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        next_cursor:
          type:
            - string
            - "null"
        total:
          type: number
      required:
        - items
        - next_cursor
        - total
      additionalProperties: false
    Transaction:
      type: object
      properties:
        date:
          $ref: "#/components/schemas/LocalDate"
        amount:
          $ref: "#/components/schemas/Money"
          description: Positive absolute amount; direction carries the sign.
        direction:
          $ref: "#/components/schemas/Direction"
        counterparty_name:
          type: string
        counterparty_inn:
          type: string
          description: Anonymized dataset token, not required to match real INN syntax.
        purpose:
          type: string
        closing_balance:
          $ref: "#/components/schemas/Money"
        external_id:
          type: string
        id:
          $ref: "#/components/schemas/EntityId"
        company_id:
          $ref: "#/components/schemas/EntityId"
        category_id:
          $ref: "#/components/schemas/CategoryId"
        category_method:
          type: string
          enum:
            - rule
            - model
            - manual
            - unknown
        category_confidence:
          anyOf:
            - $ref: "#/components/schemas/Probability"
            - type: "null"
        source:
          $ref: "#/components/schemas/SourceReference"
        matched_event_id:
          anyOf:
            - $ref: "#/components/schemas/EntityId"
            - type: "null"
      required:
        - amount
        - category_confidence
        - category_id
        - category_method
        - closing_balance
        - company_id
        - counterparty_inn
        - counterparty_name
        - date
        - direction
        - id
        - matched_event_id
        - purpose
        - source
      additionalProperties: false
    Probability:
      type: number
      minimum: 0
      maximum: 1
    SourceReference:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/SourceKind"
        source_id:
          anyOf:
            - $ref: "#/components/schemas/EntityId"
            - type: "null"
        external_id:
          type:
            - string
            - "null"
        label:
          type: string
      required:
        - kind
        - source_id
        - external_id
        - label
      additionalProperties: false
    SourceKind:
      anyOf:
        - type: string
          const: statement
        - type: string
          const: manual
        - $ref: "#/components/schemas/IntegrationKind"
    IntegrationKind:
      type: string
      enum:
        - invoice
        - contract
        - tax
        - bank
        - accounting
        - cash_register
        - marketplace
        - registry
    CategoryUpdateRequest:
      type: object
      properties:
        category_id:
          $ref: "#/components/schemas/CategoryId"
      required:
        - category_id
      additionalProperties: false
    ActualsQuery:
      type: object
      properties:
        from_date:
          $ref: "#/components/schemas/LocalDate"
        to_date:
          $ref: "#/components/schemas/LocalDate"
        granularity:
          type: string
          enum:
            - day
            - week
      additionalProperties: false
    ActualsResponse:
      type: object
      properties:
        company_id:
          $ref: "#/components/schemas/EntityId"
        data_revision:
          type: number
        days:
          type: array
          items:
            $ref: "#/components/schemas/DailyActual"
        category_totals:
          type: array
          items:
            $ref: "#/components/schemas/CategoryTotal"
      required:
        - company_id
        - data_revision
        - days
        - category_totals
      additionalProperties: false
    DailyActual:
      type: object
      properties:
        date:
          $ref: "#/components/schemas/LocalDate"
        income:
          anyOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        expense:
          anyOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        closing_balance:
          anyOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        transaction_count:
          type: number
        observation:
          type: string
          enum:
            - observed
            - confirmed_no_activity
            - missing
      required:
        - date
        - income
        - expense
        - closing_balance
        - transaction_count
        - observation
      additionalProperties: false
    CategoryTotal:
      type: object
      properties:
        category_id:
          $ref: "#/components/schemas/CategoryId"
        direction:
          $ref: "#/components/schemas/Direction"
        amount:
          $ref: "#/components/schemas/Money"
        count:
          type: number
      required:
        - category_id
        - direction
        - amount
        - count
      additionalProperties: false
    RecurringListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecurringPattern"
      required:
        - items
      additionalProperties: false
    RecurringPattern:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/EntityId"
        direction:
          $ref: "#/components/schemas/Direction"
        category_id:
          $ref: "#/components/schemas/CategoryId"
        counterparty_name:
          type: string
        cadence:
          type: string
          enum:
            - weekly
            - monthly
            - quarterly
        expected_amount:
          $ref: "#/components/schemas/Money"
        next_date:
          $ref: "#/components/schemas/LocalDate"
        confidence:
          $ref: "#/components/schemas/Probability"
        sample_count:
          type: number
        transaction_ids:
          type: array
          items:
            $ref: "#/components/schemas/EntityId"
      required:
        - id
        - direction
        - category_id
        - counterparty_name
        - cadence
        - expected_amount
        - next_date
        - confidence
        - sample_count
        - transaction_ids
      additionalProperties: false
    EventQuery:
      type: object
      properties:
        from_date:
          $ref: "#/components/schemas/LocalDate"
        to_date:
          $ref: "#/components/schemas/LocalDate"
        limit:
          type: number
        cursor:
          type: string
        status:
          $ref: "#/components/schemas/EventStatus"
        kind:
          $ref: "#/components/schemas/EventKind"
      additionalProperties: false
    EventStatus:
      type: string
      enum:
        - planned
        - partial
        - paid
        - overdue
        - cancelled
    EventKind:
      type: string
      enum:
        - manual
        - invoice
        - contract
        - tax
        - loan
        - payroll
        - recurring
    EventListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlannedEvent"
        next_cursor:
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      additionalProperties: false
    PlannedEvent:
      type: object
      properties:
        title:
          type: string
        kind:
          $ref: "#/components/schemas/EventKind"
        direction:
          $ref: "#/components/schemas/Direction"
        amount:
          $ref: "#/components/schemas/Money"
        due_date:
          $ref: "#/components/schemas/LocalDate"
        category_id:
          $ref: "#/components/schemas/CategoryId"
        counterparty_name:
          type:
            - string
            - "null"
        on_time_probability:
          anyOf:
            - $ref: "#/components/schemas/Probability"
            - type: "null"
          description: Chance of arrival on due_date, nullable when unknown.
        source:
          $ref: "#/components/schemas/SourceReference"
        id:
          $ref: "#/components/schemas/EntityId"
        company_id:
          $ref: "#/components/schemas/EntityId"
        status:
          $ref: "#/components/schemas/EventStatus"
        paid_amount:
          $ref: "#/components/schemas/Money"
        matched_transaction_ids:
          type: array
          items:
            $ref: "#/components/schemas/EntityId"
        recurrence_id:
          anyOf:
            - $ref: "#/components/schemas/EntityId"
            - type: "null"
        updated_at:
          $ref: "#/components/schemas/UtcTimestamp"
      required:
        - amount
        - category_id
        - company_id
        - counterparty_name
        - direction
        - due_date
        - id
        - kind
        - matched_transaction_ids
        - on_time_probability
        - paid_amount
        - recurrence_id
        - source
        - status
        - title
        - updated_at
      additionalProperties: false
    PlannedEventInput:
      type: object
      properties:
        title:
          type: string
        kind:
          $ref: "#/components/schemas/EventKind"
        direction:
          $ref: "#/components/schemas/Direction"
        amount:
          $ref: "#/components/schemas/Money"
